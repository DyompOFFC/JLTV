function drawBk(){
  const bk = document.querySelector('.bk');
  if(!bk) return;
  bk.querySelector('svg')?.remove();
  const cols = Array.from(bk.querySelectorAll('.bc'));
  if(!cols.length) return;
  const B = bk.getBoundingClientRect();
  const pt = (e, r) => {
    const q = e.getBoundingClientRect();
    return [(r ? q.right : q.left) - B.left + bk.scrollLeft, q.top + q.height/2 - B.top + bk.scrollTop];
  };
  let d = '';
  cols.forEach((col, colIdx) => {
    if(colIdx === 0) return;
    const bms = Array.from(col.querySelectorAll('.bm'));
    bms.forEach(bm => {
      const mid = +bm.dataset.m;
      const m = MS.find(x => x.id == mid);
      if(!m) return;
      [m.a, m.b].forEach(t => {
        if(!t || t.n === 'BYE') return;
        const te = bm.querySelector(`[data-t="${t.id}"]`);
        if(!te) return;
        let fe = null, feColIdx = -1;
        for(let j = colIdx - 1; j >= 0 && !fe; j--) {
          const prevRows = Array.from(cols[j].querySelectorAll(`.bm [data-t="${t.id}"]`));
          if(prevRows.length){ fe = prevRows[prevRows.length - 1]; feColIdx = j; }
        }
        if(!fe) return;
        const [x1, y1] = pt(fe, true);
        const [x2, y2] = pt(te, false);
        const xg = Math.round(x1 + (x2 - x1) * 0.5);
        d += `<path d="M${x1} ${y1} H${xg} V${y2} H${x2-3}" style="fill:none;stroke:#3b74b8;stroke-width:1.8" marker-end="url(#ar)"/>`;
      });
    });
  });
  if(d) {
    bk.insertAdjacentHTML('beforeend', `<svg width="${bk.scrollWidth}" height="${bk.scrollHeight}" style="position:absolute;left:0;top:0;pointer-events:none;overflow:visible"><defs><marker id="ar" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0.5L5 3L0 5.5z" style="fill:#3b74b8"/></marker></defs>${d}</svg>`);
  }
}

const GH={},SUN_NEW_SINCE=30; // SUN_NEW_SINCE: сколько дней назад сформирован «новый» SUNPEAK (дата примерная — поправь при необходимости)
const ghost=(nick,t,tag,show,num)=>{const k=[t.id,nick,tag,show||'',num||''].join('|'),b=P.find(x=>x.nick==nick)||HISTORIC_PROFILES.find(x=>x.nick==nick);return GH[k]||(GH[k]={...b,id:'g|'+k,rid:b.id,nick:show||b.nick,t,num:num||b.num||1+hs(nick+'#num')%99,_fx:!!num})};

const rhEras=t=>{if(t._er)return t._er;const ds=[...new Set(TRANSFERS.filter(x=>x[2]==t.key||x[3]==t.key).map(x=>x[0]))].sort((a,b)=>dnum(b)-dnum(a)),E=[],sg=a=>a.map(p=>p.nick).sort().join(),
 mk=(a,tag,cur)=>uniq(a.map(p=>cur?p:ghost(p.nick,t,tag))),
 add=(label,a,pl)=>{if(E.length&&sg(E.at(-1).pl)==sg(pl)){E.at(-1).a=a;return}E.push({label,a,pl})};
 ds.forEach((d,i)=>add(i?Lx('с '+d,'from '+dl(d)):Lx('Сейчас (с '+d+')','Now (since '+dl(d)+')'),dAgo(dnum(d)),mk(rosterAt(t,d),d,i==0)));
 if(!ds.length)add(Lx('Сейчас','Now'),Infinity,mk(rosterAt(t,TODAY_N),'now',true));
 else add(Lx('до '+ds.at(-1),'before '+dl(ds.at(-1))),t.key=='SUN'?SUN_NEW_SINCE:Infinity,mk(rosterAt(t,dnum(ds.at(-1))-1),'pre',false));
 if(t.key=='SUN')add(Lx('Старый состав (BackDoor1257)','Old lineup (BackDoor1257)'),Infinity,sunOld());
 E.forEach((e,i)=>{const o=E[i+1];if(o){e.in=e.pl.filter(p=>!o.pl.some(q=>q.nick==p.nick)).map(p=>p.nick);e.out=o.pl.filter(p=>!e.pl.some(q=>q.nick==p.nick)).map(p=>p.nick)}});
 return t._er=E};

const rhHTML=(t,i=0,off=0)=>{const E=rhEras(t),e=E[i],mains=e.pl.filter(p=>!isSubP(p)),subs=e.pl.filter(isSubP),
 card=(p,s)=>`<a href="#p-${p.rid||p.id}" class="${s?'subp':''}">${jbox(p)}<b>${p.fl} ${p.nick}</b><small>#${p.num} · ${s?Lx('Запасной','Substitute'):p.role}</small></a>`;
 return`<div class="bx" id="rh" style="margin-bottom:10px"><h2>${Lx('История составов','Roster history')}<span>${Lx('выбери срок или состав','pick a date or lineup')}</span></h2><div class="rhp">${RHP.map(([o,l])=>`<a class="${off===o?'on':''}" onclick="rhSet(${t.id},${rhIdx(E,o)},${o})">${l}</a>`).join('')}</div><div class="rhp">${E.map((x,j)=>`<a class="${off==null&&j==i?'on':''}" onclick="rhSet(${t.id},${j},null)">${x.label}</a>`).join('')}</div><div class="rhi"><b>${e.label}</b>${isFinite(e.a)&&e.a>0?' · '+e.a+Lx(' дн. назад',' d ago'):''}${e.in?.length||e.out?.length?' · '+Lx('пришли: ','joined: ')+(e.in.join(', ')||'—')+' · '+Lx('ушли: ','left: ')+(e.out.join(', ')||'—'):''}${i==E.length-1&&off>0&&!isFinite(e.a)?'<br>'+Lx('Более ранних данных нет — показан самый ранний известный состав.','No earlier data — showing the earliest known lineup.'):''}</div><div class="pw">${mains.map(p=>card(p,0)).join('')}${subs.map(p=>card(p,1)).join('')}</div></div>`};

const tier=r=>r>=1.25?['ELITE','#c9961a']:r>=1.15?['PRO','#2d68c4']:r>=1.05?['SOLID','#2e8b4a']:r>=.95?['RISING','#7a5bc4']:['ROOKIE','#6b7a8c'];
const mains=t=>t.pl.filter(p=>!isSubP(p)),f2=x=>x.toFixed(2);
const playerBox=p=>{const all=byR,n=all.length,i=all.findIndex(x=>x.id==p.id)+1,tm=[...p.t.pl].sort((a,b)=>b.r-a.r),ti=tm.findIndex(x=>x.id==p.id)+1,pct=Math.round((n-i)/(n-1)*100),avg=P.reduce((a,x)=>a+x.r,0)/n,d=p.r-avg,[tn,tc]=tier(p.r);
const same=P.filter(x=>x.role==p.role&&x.id!=p.id),ri=same.filter(x=>x.r>p.r).length+1;
return `<div class="bx ins"><h2 style="margin:-12px -14px 12px">📊 Позиция в лиге<span><span class="tier" style="background:${tc};margin:0">${tn}</span></span></h2><div class="ig"><div class="ic"><b>#${i}<small style="display:inline"> / ${n}</small></b><small>в лиге</small></div><div class="ic"><b>#${ti}<small style="display:inline"> / ${tm.length}</small></b><small>в команде</small></div><div class="ic"><b>#${ri}<small style="display:inline"> / ${same.length+1}</small></b><small>среди «${p.role}»</small></div><div class="ic"><b style="color:${d>=0?'#4caf50':'#d33b3b'}">${d>=0?'+':''}${f2(d)}</b><small>vs средний ${f2(avg)}</small></div></div><div class="lb"><span>Перцентиль рейтинга</span><span>топ ${100-pct||1}%</span></div><div class="pb"><i style="width:${pct}%"></i></div>${NEW_NICKS.includes(p.nick)?'<span class="newb">NEW</span> <span class="sub2">недавно добавлен в лигу</span>':''}</div>`};
const teamBox=t=>{const m=mains(t),b=t.pl.filter(isSubP),best=[...t.pl].sort((a,b)=>b.r-a.r)[0],sp=Math.max(...m.map(x=>x.r))-Math.min(...m.map(x=>x.r)),la=T.reduce((a,x)=>a+x.avg,0)/T.length,bavg=b.length?b.reduce((a,x)=>a+x.r,0)/b.length:0,dep=b.length?Math.min(100,Math.round(bavg/t.avg*100)):0,mx=Math.max(...T.map(x=>x.avg)),mn=Math.min(...T.map(x=>x.avg)),pw=Math.round((t.avg-mn)/(mx-mn||1)*100),role=[...new Set(t.pl.map(x=>x.fl))];
return `<div class="bx ins"><h2 style="margin:-12px -14px 12px">🧠 Анализ состава<span>${T.length} команд в лиге</span></h2><div class="ig"><div class="ic"><b>${f2(t.avg)}</b><small>ср. рейтинг основы</small></div><div class="ic"><b style="color:${t.avg>=la?'#4caf50':'#d33b3b'}">${t.avg>=la?'+':''}${f2(t.avg-la)}</b><small>vs среднее по лиге</small></div><div class="ic"><b>${best.nick}</b><small>лидер · ${f2(best.r)}</small></div><div class="ic"><b>${f2(sp)}</b><small>разброс основы</small></div><div class="ic"><b>${role.length}</b><small>нац. в составе ${role.join('')}</small></div></div><div class="lb"><span>Сила состава (мин–макс по лиге)</span><span>${pw}%</span></div><div class="pb"><i style="width:${pw}%"></i></div><div class="lb"><span>Глубина скамейки (запасные / основа)</span><span>${b.length?b.length+' зап. · '+dep+'%':'нет запасных'}</span></div><div class="pb"><i style="width:${dep}%"></i></div></div>`};

favSide();draw();

// ===== флаги: canvas вместо эмодзи (на Windows эмодзи-флаги показываются как «RU», «LV») =====
(()=>{
const RE=/[\u{1F1E6}-\u{1F1FF}]{2}/gu,C={};
const url=code=>{if(C[code])return C[code];const cv=document.createElement('canvas');cv.width=150;cv.height=100;const g=cv.getContext('2d');g.scale(.5,.5);try{FLAGART.draw(g,code)}catch(e){}return C[code]=B64(cv.toDataURL())};
const SKIP=/^(SCRIPT|STYLE|TEXTAREA|OPTION|SELECT|TITLE|CANVAS|NOSCRIPT)$/;
const fix=n=>{
 if(n.nodeType==3){
  const p=n.parentNode;if(!p||SKIP.test(p.nodeName)||!RE.test(n.data)){RE.lastIndex=0;return}RE.lastIndex=0;
  const t=n.data,f=document.createDocumentFragment();let i=0,m;
  while((m=RE.exec(t))){if(m.index>i)f.append(t.slice(i,m.index));
   const im=document.createElement('img');im.className='cf';im.alt=m[0];im.src=url(flagCode(m[0]));im.draggable=false;f.append(im);i=m.index+2*2}
  if(i<t.length)f.append(t.slice(i));RE.lastIndex=0;p.replaceChild(f,n)
 }else if(n.nodeType==1&&!SKIP.test(n.nodeName)){if(!RE.test(n.textContent)){RE.lastIndex=0;return}RE.lastIndex=0;const w=document.createTreeWalker(n,4),l=[];while(w.nextNode())l.push(w.currentNode);l.forEach(fix)}
};
if(typeof FLAGART=='undefined')return;
let busy=0;
const ob=new MutationObserver(ms=>{if(busy)return;busy=1;try{ms.forEach(m=>{m.addedNodes.forEach(fix);if(m.type=='characterData')fix(m.target)})}finally{busy=0}});
ob.observe(document.body,{childList:true,subtree:true,characterData:true});
fix(document.body);
})();

setTimeout(()=>ric(run),600);
})();
